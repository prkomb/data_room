services:
  - type: web
    name: data-room-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >-
      npm install &&
      npx prisma generate --schema apps/api/prisma/schema.prisma &&
      npm run build -w packages/shared &&
      npm run build -w apps/api &&
      npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: data-room-files
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
      - key: PORT
        value: "4000"
